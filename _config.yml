name: Elijah Hauber
title: Elijah Hauber
url: https://ethauber.github.io
baseurl: ""
# Lets jekyll-github-metadata work without a git remote or API token.
repository: ethauber/ethauber.github.io
lang: en
author:
  name: Elijah Hauber
email: ethauber@outlook.com
location: IN, USA
role: Software Engineer
# Single source of truth for the "N years of experience" copy.
years_experience: 8
# Keep the number below in step with years_experience (config can't interpolate).
description: >-
  Elijah Hauber - Software Engineer with 8 years of experience in web
  development, Python, JavaScript, and cloud technologies.
logo: /assets/myphoto2025.jpeg

# jekyll-seo-tag
social:
  name: Elijah Hauber
  links:
    - https://www.linkedin.com/in/ethauber
    - https://github.com/ethauber
    - https://medium.com/@ethauber

# Third-party scripts. Leave a value empty to turn that script off.
# The old Universal Analytics property (UA-100709643-1) stopped collecting
# data when Google retired UA, so it is off until a GA4 "G-..." id is set.
# AdSense is kept off to align with privacy/index.html (no third-party cookies).
google_analytics:
adsense_client:

markdown: kramdown
permalink: /blog/:year/:month/:day/:title

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed
  sourcemap: never

# Keep repo tooling and docs out of the published site.
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - mise.toml
  - docs
  - scripts
  - tests
  - node_modules
  - vendor
  - arcana/generate_badges.py
  - _compress_images_cache.yml
