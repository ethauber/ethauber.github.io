# Data for the /space/ page.
#
# Each planet's `orbit` block feeds the 3D orbit view (assets/js/orbit.js).
# The numbers are the real ones; the script compresses them so everything
# fits on screen.
#   distance_au:   average distance from the Sun, in astronomical units
#   period_days:   time to go around the Sun once, in Earth days
#   radius_earths: planet radius relative to Earth
#   color:         colour of the planet in the 3D view
#   ring:          true draws a ring (Saturn)
sun:
  color: "#ffcf6b"
breadcrumb:
  - name: Universe
    url: https://science.nasa.gov/universe/
    title: NASA Universe Overview
  - name: Laniakea Supercluster
    url: https://en.wikipedia.org/wiki/Laniakea_Supercluster
    title: Laniakea Supercluster
  - name: Virgo Cluster
    url: https://en.wikipedia.org/wiki/Virgo_Cluster
    title: Virgo Cluster
  - name: Local Group
    url: https://en.wikipedia.org/wiki/Local_Group
    title: Local Group
  - name: Milky Way Galaxy
    url: https://science.nasa.gov/resource/the-milky-way-galaxy
    title: Milky Way Galaxy
  - name: Orion's Arm
    url: https://en.wikipedia.org/wiki/Orion_Arm
    title: Orion's Arm
  - name: Solar System (Earth)
    url: https://science.nasa.gov/solar-system
    title: Solar System
planets:
  - id: mercury
    name: Mercury
    orbit:
      distance_au: 0.39
      period_days: 88
      radius_earths: 0.383
      color: "#a39d97"
    image: 439_MercurySubtleColors1200w.jpg
    image_credit_url: https://solarsystem.nasa.gov/resources/439/mercurys-subtle-colors/?category=planets_mercury
    facts:
      - 'Distance from Sun: 35.98 million mi'
      - 'Orbital period: 88 days'
      - 'Mass: 3.285 x 10^23 kg (0.055 M⊕)'
      - 'Surface area: 28.88 million mi²'
      - 'Length of day: 58d 15h 30m'
    maps_url: https://www.google.com/maps/space/mercury
    nasa_url: https://science.nasa.gov/mercury/
    source_url: https://g.co/kgs/p2NV4e
  - id: venus
    name: Venus
    orbit:
      distance_au: 0.72
      period_days: 225
      radius_earths: 0.949
      color: "#dcb67c"
    image: venusglobe.jpg
    image_credit_url: https://nssdc.gsfc.nasa.gov/photo_gallery/photogallery-venus.html
    facts:
      - 'Distance from Sun: 67.24 million mi'
      - 'Orbital period: 225 days'
      - 'Length of day: 116d 18h 0m'
      - 'Surface area: 177.7 million mi²'
      - 'Equatorial rotation velocity: 6.52 km/h (1.81 m/s)'
    maps_url: https://www.google.com/maps/space/venus
    nasa_url: https://solarsystem.nasa.gov/planets/venus/overview/
    source_url: https://share.google/yxVjpHpSm3gKtvEEr
  - id: earth
    name: Earth
    orbit:
      distance_au: 1.0
      period_days: 365
      radius_earths: 1.0
      color: "#4f86d1"
    image: westernhemisphere_geos_2019246_lrg.jpg
    image_credit_url: https://www.nasa.gov/topics/earth/images/index.html
    facts:
      - 'Age: 4.543 billion years'
      - 'Distance from Sun: 92.96 million mi'
      - 'Radius: 3,958.8 mi'
      - 'Population: 7.53 billion (2017) World Bank'
      - Earth is wider around the equator
    maps_url: https://www.google.com/maps/space/earth
    nasa_url: https://www.nasa.gov/topics/earth/index.html
    source_url: https://g.co/kgs/bdiXLa
  - id: mars
