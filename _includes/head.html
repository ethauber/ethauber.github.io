<head>
  {%- comment %} Set the theme before first paint so there is no light/dark flash. {% endcomment %}
  <script>
    (function () {
      var saved = null, prefersDark = false;
      try { saved = window.localStorage.getItem('theme'); } catch (e) {}
      try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{{ page.title | default: site.title }}</title>
  {% seo title=false %}

  <link rel="icon" type="image/svg+xml" href="/assets/coffee.svg">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}'s Blog" href="/blog/atom.xml">

  {%- assign v = site.time | date: '%s' %}
  <link rel="stylesheet" href="/assets/css/vendor/bootstrap-4.3.1.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v={{ v }}">
  <link rel="stylesheet" href="/assets/css/easter-eggs.css?v={{ v }}">
  <link rel="stylesheet" href="/assets/css/terminal.css?v={{ v }}">

  {% include analytics.html %}
</head>
