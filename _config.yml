name: Elijah Hauber
title: Elijah Hauber

markdown: kramdown
permalink: /blog/:year/:month/:day/:title

# Performance optimizations
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

# Plugins for performance
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# These are not allowed on GitHub Pages by default
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/about-github-pages-and-jekyll
# https://pages.github.com/versions.json
#   - jekyll-compress-images
#   - jekyll-minifier

# jekyll-minifier:
#   exclude:
#     - assets/**/*.svg

# Image optimization
# compress_images:
#   images_path: "assets/**/*.{gif,png,jpg,jpeg,svg}"

# Sass configuration for CSS optimization
sass:
  style: compressed
  sourcemap: never

# Exclude unnecessary files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _compress_images_cache.yml
