---
layout: default
classes: post-page
---
<div class="container page">
  <a href="/#blog" class="btn btn-outline-secondary">&larr; Back to Blog</a>
</div>

<article class="post" markdown="1">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_string }}</time>
  </p>
  {{ content }}
</article>
