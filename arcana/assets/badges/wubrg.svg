<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1F2937" />
  
  <!-- Color Stripes at bottom -->
  <g>
    <rect x="0.0" y="110" width="80.0" height="10" fill="#F9FAFB" />
    <rect x="80.0" y="110" width="80.0" height="10" fill="#3B82F6" />
    <rect x="160.0" y="110" width="80.0" height="10" fill="#9CA3AF" />
    <rect x="240.0" y="110" width="80.0" height="10" fill="#EF4444" />
    <rect x="320.0" y="110" width="80.0" height="10" fill="#10B981" />
  </g>
  
  <!-- Text -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#F3F4F6" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">FIVE COLOR</text>
  
  <!-- Border -->
  <rect x="0" y="0" width="400" height="120" fill="none" stroke="#374151" stroke-width="4" />
</svg>