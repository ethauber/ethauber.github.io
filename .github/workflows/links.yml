name: External link check

# Outbound links rot on their own schedule, so they are checked weekly rather
# than on every push (a flaky third-party site should not block a deploy).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # The built pages use root-relative links (/assets/..., /#home).
          # lychee needs --root-dir to resolve those, and errors without it.
          # Internal links are html-proofer's job in deploy.yml, so only
          # http(s) links are checked here.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            --scheme http
            --scheme https
            --max-retries 2
            --accept 200..=299,403,429
            --exclude-path _site/games
            --exclude linkedin.com
            './_site/**/*.html'
          fail: true
