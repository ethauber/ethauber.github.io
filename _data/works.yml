# Everything listed in the Works section of the home page (and /works/).
# Each group renders as a heading plus a card grid.
#   url:    where the card goes (internal paths start with /)
#   image:  optional, file in assets/ or a full /path (add screenshots here later)
#   emoji:  shown as a placeholder when there is no image
#   tags:   small labels under the title (engine, platform, status)
#   links:  optional extra links shown at the bottom of the card
