<svg width="400" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap');
      .title { font-family: 'Roboto', sans-serif; font-weight: bold; font-size: 28px; fill: #F3F4F6; }
      .emoji { font-size: 80px; }
      .desc { font-family: 'Roboto', sans-serif; font-size: 14px; fill: #D1D5DB; }
      .footer { font-family: 'Roboto', sans-serif; font-size: 10px; fill: #9CA3AF; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1F2937" rx="12" ry="12" />

  <!-- Color Stripes at Top (Header) -->
  <g>
    <rect x="0.0" y="0" width="200.0" height="10" fill="#10B981" />
    <rect x="200.0" y="0" width="200.0" height="10" fill="#F9FAFB" />
  </g>

  <!-- Main Title -->
  <text x="50%" y="50" text-anchor="middle" class="title">SELESNYA</text>

  <!-- Central Emoji Icon -->
  <text x="50%" y="140" text-anchor="middle" dominant-baseline="middle" class="emoji">🌻</text>

  <!-- Description Text (Multi-line) -->
  <g transform="translate(0, 190)">
    <text x="50%" y="0" text-anchor="middle" class="desc">At my best, I create inclusive societies where</text>
    <text x="50%" y="20" text-anchor="middle" class="desc">everyone supports one another.</text>
  </g>

  <!-- Footer -->
  <text x="50%" y="265" text-anchor="middle" class="footer">CLICK TO TAKE THE QUIZ</text>

  <!-- Border -->
  <rect x="0" y="0" width="400" height="280" fill="none" stroke="#374151" stroke-width="4" rx="12" ry="12" />
</svg>
